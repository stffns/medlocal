[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medlocal"
version = "0.1.0"
description = "Offline clinical consultation & training for community health workers"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Jayson Steffens", email = "stffns@gmail.com"}]
keywords = ["health", "offline", "spaced-repetition", "RAG", "gemma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "vstash>=0.26.0",
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "fsrs>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
medlocal = "medlocal.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
